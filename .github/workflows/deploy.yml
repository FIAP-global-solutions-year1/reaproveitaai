name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
      - branch-edu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react/package.json

      - name: Instalar dependências
        run: |
          cd react
          npm install

      - name: Build do Vite (React)
        run: |
          cd react
          npm run build

      - name: Montar pasta pública do site
        run: |
          mkdir -p public_site
          # Copia os arquivos estáticos da raiz
          cp -r css img js index.html produtos.html faleconosco.html public_site/
          # Copia os arquivos compilados pelo Vite (carrinho.html e assets)
          cp -r dist/* public_site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
